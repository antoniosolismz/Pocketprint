server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name print.otelo2.com pocketprint pocketprint.home.arpa;

    root /var/www/pocketprint;
    index index.html;
    server_tokens off;

    # This is a tool that gets updated, and a stale cached bundle reads exactly like a
    # broken fix (it cost us one debugging round). Always revalidate; the files are ~40 KB.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Chrome wants the manifest with its proper type; nginx does not know .webmanifest.
    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # the page talks to a printer over Bluetooth and to nothing else
}
